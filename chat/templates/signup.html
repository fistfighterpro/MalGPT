{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 380px; margin: 0 auto;">
    <h2>Sign Up</h2>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width:100%;">Sign Up</button>
    </form>
    <p style="font-size: 14px; margin-top: 16px;">Already have an account? <a href="/accounts/login/">Log in</a></p>
</div>
{% endblock %}
