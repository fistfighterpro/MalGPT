{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 360px; margin: 0 auto;">
    <h2>Log In</h2>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width:100%;">Log In</button>
    </form>
    <p style="font-size: 14px; margin-top: 16px;">No account? <a href="/signup/">Sign up</a></p>
</div>
{% endblock %}
